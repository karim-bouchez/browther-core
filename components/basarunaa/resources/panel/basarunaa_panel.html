<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Basarunaa</title>
  <link rel="stylesheet" href="chrome-untrusted://resources/css/reset.css">
  <link rel="stylesheet" href="chrome-untrusted://resources/css/text_defaults_md.css">
  <link rel="stylesheet" href="chrome-untrusted://resources/brave/css/nala.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 20px 20px 24px;
      font-family: var(--leo-font-default-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
      background: var(--leo-color-container-background, #1a1a2e);
      color: var(--leo-color-text-primary, #eee);
    }
    .header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 18px;
    }
    .header h1 {
      margin: 0; font-size: 18px; font-weight: 600;
      color: var(--leo-color-text-primary);
    }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0;
    }
    .row .label {
      font-size: 14px; font-weight: 500;
    }
    .row .desc {
      font-size: 12px; opacity: 0.7; margin-top: 4px;
    }
    .toggle {
      position: relative;
      width: 40px; height: 22px;
      appearance: none;
      background: var(--leo-color-icon-disabled, #555);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
      border: none;
      outline: none;
      flex-shrink: 0;
    }
    .toggle:checked {
      background: var(--leo-color-primary-50, #4c9eff);
    }
    .toggle::before {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 18px; height: 18px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .toggle:checked::before {
      transform: translateX(18px);
    }
    .toggle:focus-visible {
      box-shadow: 0 0 0 2px var(--leo-color-primary-30, #4c9eff66);
    }
    .toggle-row {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px;
    }
    .toggle-row .text { flex: 1; }
    .section {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--leo-color-divider-subtle, #ffffff15);
    }
    .section-label {
      font-size: 12px; opacity: 0.7;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .radio-group { display: flex; flex-direction: column; gap: 6px; }
    .radio-group label {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 8px; border-radius: 6px;
      cursor: pointer; font-size: 14px;
      transition: background 0.15s ease;
    }
    .radio-group label:hover {
      background: var(--leo-color-container-highlight, #ffffff08);
    }
    .radio-group input[type="radio"] {
      appearance: none;
      width: 16px; height: 16px;
      border: 2px solid var(--leo-color-icon-default, #888);
      border-radius: 50%;
      cursor: pointer; margin: 0;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.15s ease;
    }
    .radio-group input[type="radio"]:checked {
      border-color: var(--leo-color-primary-50, #4c9eff);
    }
    .radio-group input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--leo-color-primary-50, #4c9eff);
    }
    body[data-disabled="true"] .section { opacity: 0.4; pointer-events: none; }
    .slider-row { padding: 6px 0; }
    .slider-row .slider-head {
      display: flex; justify-content: space-between;
      font-size: 13px; margin-bottom: 4px;
    }
    .slider-row .slider-value {
      font-variant-numeric: tabular-nums;
      opacity: 0.75;
    }
    .slider-row input[type="range"] {
      appearance: none;
      width: 100%; height: 4px;
      background: var(--leo-color-icon-disabled, #555);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      margin: 0;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 14px; height: 14px;
      background: var(--leo-color-primary-50, #4c9eff);
      border-radius: 50%;
      cursor: pointer;
    }
    .slider-row input[type="range"]:focus-visible {
      box-shadow: 0 0 0 2px var(--leo-color-primary-30, #4c9eff66);
    }
    .dev-section {
      margin-top: 22px;
      padding: 14px 12px;
      border: 1px dashed var(--leo-color-divider-strong, #ffffff25);
      border-radius: 8px;
      background: var(--leo-color-container-highlight, #ffffff05);
    }
    .dev-section .section-label {
      display: flex; align-items: center; gap: 6px;
      color: var(--leo-color-systemfeedback-warning-text, #f59e0b);
      margin-bottom: 10px;
    }
    .dev-section .section-label::before {
      content: '🛠';
      font-size: 14px;
    }
    .dev-section .toggle-row { padding: 0; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Basarunaa</h1>
  </div>
  <div class="toggle-row">
    <div class="text">
      <div class="label">Activer Basarunaa</div>
      <div class="desc" id="status">Chargement…</div>
    </div>
    <input type="checkbox" class="toggle" id="enabled-toggle" aria-label="Activer Basarunaa">
  </div>
  <div class="section" id="mode-section">
    <div class="section-label">Mode</div>
    <div class="radio-group">
      <label><input type="radio" name="mode" value="blur-female">Flouter les femmes</label>
      <label><input type="radio" name="mode" value="blur-male">Flouter les hommes</label>
      <label><input type="radio" name="mode" value="blur-all">Flouter tout le monde</label>
    </div>
  </div>
  <div class="section" id="sliders-section">
    <div class="section-label">Détection</div>
    <div class="slider-row">
      <div class="slider-head">
        <span>Confiance corps</span>
        <span class="slider-value" id="conf-body-value">—</span>
      </div>
      <input type="range" id="conf-body" min="0" max="100" step="1">
    </div>
    <div class="slider-row">
      <div class="slider-head">
        <span>Confiance visage</span>
        <span class="slider-value" id="conf-face-value">—</span>
      </div>
      <input type="range" id="conf-face" min="0" max="100" step="1">
    </div>
    <div class="slider-row">
      <div class="slider-head">
        <span>Certitude genre</span>
        <span class="slider-value" id="gender-certainty-value">—</span>
      </div>
      <input type="range" id="gender-certainty" min="0" max="100" step="1">
    </div>
  </div>
  <div class="section dev-section" id="dev-section">
    <div class="section-label">Debug</div>
    <div class="radio-group">
      <label><input type="radio" name="debug-mode" value="none">Aucun</label>
      <label><input type="radio" name="debug-mode" value="boxes">Boxes</label>
      <label><input type="radio" name="debug-mode" value="debug">Debug complet</label>
    </div>
    <div class="toggle-row">
      <div class="text">
        <div class="label">Capture des analyses</div>
        <div class="desc">Sauvegarde les images dans ~/Downloads/basarunaa-capture/</div>
      </div>
      <input type="checkbox" class="toggle" id="capture-toggle" aria-label="Activer la capture">
    </div>
    <div class="toggle-row" style="margin-top: 12px;">
      <div class="text">
        <div class="label">Test inference (native)</div>
        <div class="desc" id="test-infer-status">Lance YOLO sur l'image bundle de test, logs LOG(INFO).</div>
      </div>
      <button id="test-infer-btn" style="appearance: none; border: 1px solid var(--leo-color-divider-strong, #ffffff25); background: var(--leo-color-container-highlight, #ffffff08); color: var(--leo-color-text-primary, #eee); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;">Run</button>
    </div>
  </div>
  <script type="module" src="basarunaa_panel.bundle.js"></script>
</body>
</html>
