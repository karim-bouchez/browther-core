name: Build Android APK

on:
  workflow_dispatch:  # Lancement manuel uniquement

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # max GitHub Actions

    steps:
      - name: Libérer de l'espace disque
        run: |
          echo "=== Espace avant nettoyage ==="
          df -h /
          # Supprimer les logiciels pré-installés inutiles
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/.ghcup /usr/lib/jvm /usr/local/graalvm \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/share/miniconda /opt/az /opt/microsoft \
            /usr/lib/google-cloud-sdk /usr/lib/mono /usr/share/kotlinc \
            /usr/lib/firefox /usr/share/dotnet /usr/share/gradle* \
            /usr/share/sbt /usr/local/julia* /usr/share/az_* \
            /usr/share/man /usr/share/doc /usr/share/locale \
            /var/lib/apt/lists/* /var/cache/apt/archives/*
          # Supprimer les snaps
          sudo snap remove --purge lxd 2>/dev/null || true
          sudo snap remove --purge core20 2>/dev/null || true
          sudo snap remove --purge snapd 2>/dev/null || true
          sudo apt-get purge -y snapd || true
          # Docker
          sudo docker image prune --all --force || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          # Supprimer le swap pour gagner de l'espace disque
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          echo "=== Espace après nettoyage ==="
          df -h /

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl wget python3 python3-pip \
            build-essential ninja-build pkg-config lsb-release \
            gperf libdrm-dev libcups2-dev libpango1.0-dev \
            libgtk-3-dev libxss-dev libnss3-dev libgbm-dev

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Installer depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git ~/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Checkout browther-core
        uses: actions/checkout@v4
        with:
          path: src/brave
          fetch-depth: 1

      - name: Configurer le workspace
        run: |
          cd $GITHUB_WORKSPACE
          echo "=== Structure workspace ==="
          ls -la
          ls -la src/brave/

      - name: Init Android (gclient sync)
        run: |
          cd $GITHUB_WORKSPACE/src/brave
          npm install
          echo "=== Début npm run init (gclient sync) ==="
          npm run init -- --target_os=android --target_arch=arm
          echo "=== Init terminé ==="
          df -h /

      - name: Libérer de l'espace post-sync
        run: |
          echo "=== Espace avant nettoyage post-sync ==="
          df -h /
          # Supprimer les .git imbriqués (historique git des deps, ~5-10 GB)
          find $GITHUB_WORKSPACE/src -path "*/third_party/*/.git" -type d -exec rm -rf {} + 2>/dev/null || true
          find $GITHUB_WORKSPACE/src -path "*/.git/modules" -type d -exec rm -rf {} + 2>/dev/null || true
          # Supprimer les données de test volumineuses (seulement dans third_party, PAS dans brave/)
          find $GITHUB_WORKSPACE/src/third_party -path "*/test_data" -type d -exec rm -rf {} + 2>/dev/null || true
          find $GITHUB_WORKSPACE/src/third_party -path "*/testdata" -type d -exec rm -rf {} + 2>/dev/null || true
          # APT cache accumulé par install-build-deps
          sudo apt-get clean || true
          echo "=== Espace après nettoyage post-sync ==="
          df -h /

      - name: Installer les deps build Chromium
        run: |
          cd $GITHUB_WORKSPACE/src
          sudo bash build/install-build-deps.sh --no-prompt --android

      - name: Vérifier les ressources avant build
        run: |
          echo "=== Mémoire ==="
          free -h
          echo "=== Disque ==="
          df -h /
          echo "=== CPU ==="
          nproc

      - name: Build Android APK
        run: |
          cd $GITHUB_WORKSPACE/src/brave
          echo "=== Début du build Android ==="
          npm run build -- --target_os=android --target_arch=arm
          echo "=== Build terminé ==="
          df -h /

      - name: Trouver et uploader l'APK
        uses: actions/upload-artifact@v4
        with:
          name: browther-android-apk
          path: |
            src/out/android_Component_arm/apks/*.apk
            src/out/android_Release_arm/apks/*.apk
          if-no-files-found: warn
          retention-days: 7
